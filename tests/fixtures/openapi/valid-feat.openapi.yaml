openapi: 3.1.0
info:
  title: Valid FEAT contract
  version: 0.1.0
servers:
  - url: https://api.example.com
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Thing:
      type: object
      required: [id, name, ownerId, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
paths:
  /things:
    post:
      operationId: createThing
      summary: Create a Thing
      security: [{ bearerAuth: [] }]
      x-idempotent: false
      x-ratelimit: { window: 1m, limit: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ownerId]
              properties:
                name: { type: string }
                ownerId: { type: string, format: uuid }
            examples:
              happy:
                value: { name: "Hat", ownerId: "11111111-1111-1111-1111-111111111111" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thing' }
              examples:
                happy:
                  value:
                    id: "22222222-2222-2222-2222-222222222222"
                    name: "Hat"
                    ownerId: "11111111-1111-1111-1111-111111111111"
                    createdAt: "2026-06-06T12:00:00Z"
        '400':
          description: Validation failure
          content:
            application/json:
              examples:
                validation:
                  value: { error: "validation", fields: ["name"] }
        '409':
          description: Duplicate
          content:
            application/json:
              examples:
                duplicate:
                  value: { error: "duplicate" }
