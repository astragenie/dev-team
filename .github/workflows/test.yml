name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node ./scripts/validate-manifests.mjs
      - run: node ./scripts/validate-skills.mjs
      - run: node ./scripts/validate-slices.mjs
      - name: Validate routing-table skill IDs (advisory)
        env:
          CREW_VALIDATE_ROUTING_TABLE: "1"
        continue-on-error: true
        run: node ./scripts/validate-routing-table.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: node --test
      - run: node ./scripts/e2e-smoke.mjs
