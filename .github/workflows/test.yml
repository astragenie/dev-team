name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node ./scripts/validate-manifests.mjs
      - run: node ./scripts/validate-skills.mjs
      - run: node ./scripts/validate-agents.mjs
      - run: node ./scripts/validate-slices.mjs
      - name: Validate contracts (against committed fixtures)
        run: |
          for f in tests/fixtures/openapi/*.openapi.yaml; do
            if [ "$(basename "$f")" = "broken-missing-examples.openapi.yaml" ]; then
              # Negative fixture — expect failure
              if node ./scripts/validate-contracts.mjs "$f"; then
                echo "ERROR: negative fixture passed lint"
                exit 1
              fi
            else
              node ./scripts/validate-contracts.mjs "$f"
            fi
          done
      - name: Validate UX spec fixtures
        run: |
          for f in tests/fixtures/ux-specs/*.md; do
            if [ "$(basename "$f")" = "missing-operationid.md" ]; then
              if node ./scripts/validate-ux-spec.mjs "$f"; then
                echo "ERROR: negative fixture passed"
                exit 1
              fi
            else
              node ./scripts/validate-ux-spec.mjs "$f"
            fi
          done
      - name: Validate synthesis artifacts (advisory)
        continue-on-error: true
        run: node ./scripts/validate-syntheses.mjs
      - name: Validate routing-table skill IDs (advisory)
        env:
          CREW_VALIDATE_ROUTING_TABLE: "1"
        continue-on-error: true
        run: node ./scripts/validate-routing-table.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Validate type-graph (advisory, becomes blocking in Phase 5)
        continue-on-error: true
        run: npm run validate:typegraph
      - run: node --test --experimental-strip-types
      - run: node ./scripts/e2e-smoke.mjs
      - name: e2e smoke — ux validation
        run: npm run e2e:smoke:ux
