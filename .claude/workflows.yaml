version: 1
default_workflow: regular

workflows:
  regular:
    description: Standard slice — tag-routed builder + parallel reviewer+validator fanout
    phases:
      - role: builder
        routing:
          tag_routes:
            fe: crew:frontend-dev
            frontend: crew:frontend-dev
            be: crew:backend-dev
            backend: crew:backend-dev
            parallel-fe-be:
              parallel_dispatch:
                group: [crew:frontend-dev, crew:backend-dev]
                policy: wait_for_all
                halt_on: any_FAIL
          default: crew:fullstack-dev
        emit: handoff
      - role: reviewer
        parallel_dispatch:
          group: [crew:reviewer, crew:reviewer, crew:verifier]
          policy: wait_for_all
          halt_on: any_FAIL
        aggregation:
          halt_on_any_FAIL: true
          wait_for_all: true
        trigger:
          on: handoff_written
          from: builder
        gate:
          policy: all_pass
          fail_action: route_to_fix
        skip_when: changed_files matches "^docs/"

  quick:
    description: Light slice — single combined reviewer+verifier, no fanout
    phases:
      - role: builder
        agent: crew:fullstack-dev
        emit: handoff
      - role: reviewer_validator
        agent: crew:reviewer-lite
        parallel: 1
        trigger:
          on: handoff_written
          from: builder
        gate:
          policy: all_pass
          fail_action: route_to_fix

  spike:
    description: Throwaway exploration — builder only, no review/validate gates
    phases:
      - role: builder
        agent: crew:fullstack-dev
        emit: handoff

  release:
    description: Release slice — builder + 2 reviewers + validator + deployer (user approval required)
    phases:
      - role: builder
        agent: crew:fullstack-dev
        emit: handoff
      - role: reviewer
        parallel_dispatch:
          group: [crew:reviewer, crew:reviewer, crew:verifier]
          policy: wait_for_all
          halt_on: any_FAIL
        aggregation:
          halt_on_any_FAIL: true
          wait_for_all: true
        gate:
          policy: all_pass
          fail_action: route_to_fix
      - role: validator
        agent: crew:verifier
        gate:
          policy: blocking
      - role: deployer
        agent: crew:release-engineer
        require_user_approval: true
        gate:
          policy: blocking
