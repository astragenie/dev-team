# .claude/crew/telemetry.yaml — FEAT-165 OTel bridge config. Default OFF.
# Two-key opt-in: set "enabled" to true below AND export CREW_OTEL_ENABLED=1 in env.
# Copy this file to .claude/crew/telemetry.yaml and flip "enabled" to true to activate.
# See docs/observability/langfuse-bridge.md for setup instructions.
enabled: false

# OTLP HTTP endpoint. Default: self-hosted Langfuse on localhost:3000.
endpoint: "http://localhost:3000/api/public/otel/v1/traces"

# HTTP auth header. ${VAR} tokens are resolved from process.env at hook time.
auth:
  header_name: "Authorization"
  # Set LANGFUSE_AUTH_B64=$(echo -n "pk-lf-...:sk-lf-..." | base64) before enabling.
  header_value: "Basic ${LANGFUSE_AUTH_B64}"

# Fraction of hook calls to sample (1.0 = 100%, 0.1 = 10%).
sample_rate: 1.0

# PII scrub (recommended: true). Redacts tool inputs, diffs, long strings.
scrub_pii: true

# File-path globs — attrs whose string VALUE matches are redacted.
redact_paths:
  - "**/.env"
  - "**/.env.*"
  - "**/secrets/**"
  - "**/*credentials*"
  - "**/private/**"
  - "**/*.pem"
  - "**/*.key"

# String attrs longer than this are replaced with <redacted:length=N>.
redact_attr_max_chars: 2048

# BatchSpanProcessor tuning. Increase max_queue_size on high-frequency hook hosts.
max_queue_size: 2048
schedule_delay_ms: 5000
export_timeout_ms: 30000
