version: 1.0.0
# Agents intentionally referenced before they exist, each with documented
# registry-fallback handling at its reference sites. Single source —
# validate-agent-refs.ts and validate-configs.ts both read this list. Never add
# a name to silence a typo. Currently empty: the former combined LOW-tier
# `reviewer-validator`/`reviewer-verifier` agent was permanently superseded by
# `reviewer` + `verifier` concurrent dispatch (2026-07-04, arch-review §2.1), so
# it is no longer a forward reference — every reference to it was removed.
forward_references: []
rows:
  - section: builder-matrix
    signal: "`surface:ui` OR `stack:react` only"
    notes: any
    route_to: "`crew:frontend-dev` (+ `crew:uxdesigner` if `NEEDS_UX`)"
  - section: builder-matrix
    signal: "`surface:api` / `surface:schema` / `stack:csharp` / `stack:node` / `stack:python` only"
    notes: any
    route_to: "`crew:backend-dev`"
  - section: builder-matrix
    signal: BOTH FE + BE tags
    notes: any
    route_to: "`crew:frontend-dev` + `crew:backend-dev` + `crew:uxdesigner` parallel (SPLIT_BUILD)"
  - section: builder-matrix
    signal: No FE/BE tags (untagged)
    notes: "`TS_TOOLING_ONLY = true` (all files are `.ts` / `scripts/` / `tests/` / `evals/`, none are `.tsx` / `.css` / `src/components/`)"
    route_to: "`crew:backend-dev` (pure-TS tooling default)"
  - section: builder-matrix
    signal: No FE/BE tags (untagged)
    notes: "`TS_TOOLING_ONLY = false` (agent, skill, hook, doc, or mixed edits)"
    route_to: "`crew:fullstack-dev` (legitimate generalist)"
  - section: builder-matrix
    signal: 'Cross-layer with `skip: ["split-build"]`'
    notes: any
    route_to: "`crew:fullstack-dev` (explicit override)"
  - section: workflow-signals
    signal: "**New feature request** (FEAT-\\*, `feat:` in title)"
    route_to: dispatcher + fullstack-dev
    notes: Dispatcher refines scope, sketches acceptance; fullstack-dev picks up bounded implementation. Pair with `/crew:build` to auto-select bounded skills.
  - section: workflow-signals
    signal: "**Urgent bug fix** (`fix:` commits, production-impacting)"
    route_to: dispatcher + verifier
    notes: Dispatcher triages and scopes; fullstack-dev fixes in isolation; verifier confirms behavior before merge. May skip reviewer if fix is trivial, but document the decision.
  - section: workflow-signals
    signal: "**Code quality / simplification** (refactor, lint, complexity cuts)"
    route_to: reviewer + fullstack-dev
    notes: Fullstack-dev owns refactor; reviewer gates the changes. Tests must stay green. No behavioral change expected.
  - section: workflow-signals
    signal: "**Standalone quality sweep** (stale-ref cleanup, complexity cap enforcement, manifest consistency)"
    route_to: "`crew:refactor`"
    notes: Dispatch as a standalone slice. Agent scans repo (or scoped path), fixes directly, writes `.claude/artifacts/crew/quality/` artifact before committing. Reviewer gates the artifact + diff. Hard stop at >20 files affected.
  - section: workflow-signals
    signal: "**Documentation-only change** (docs, README, guides)"
    route_to: dispatcher (optional review)
    notes: No behavioral change; minimal quality gate needed. Helpful to spot gaps but not blocking.
  - section: workflow-signals
    signal: "**Dependency updates / chore** (chore:, version bump, marketplace sync)"
    route_to: release-engineer + reviewer
    notes: Release-engineer or dispatcher owns the change; reviewer validates no silent breakage. Post-merge, release-engineer confirms artifact/plugin registration is live.
  - section: workflow-signals
    signal: "**Ambiguous scope** (unclear where to start, spans multiple modules)"
    route_to: dispatcher
    notes: Re-scope task, define boundaries, then dispatch to fullstack-dev. Use `/crew:using-crew` to frame the work.
  - section: workflow-signals
    signal: "**Cross-module / architectural refactor** (touches 5+ files, changes public API)"
    route_to: dispatcher
    notes: Too large for single fullstack-dev. Dispatcher shapes the plan; consider splitting into smaller FEATs or slices.
  - section: workflow-signals
    signal: "**Validation or behavior verification needed** (user-facing behavior changed, or tests added)"
    route_to: verifier
    notes: Run the app, verify user-visible behavior, document evidence. Pair with `/verify` skill.
  - section: workflow-signals
    signal: "**Ship or release** (merge, promote to production, tag release)"
    route_to: release-engineer + dispatcher approval
    notes: Release-engineer owns the push; the dispatcher explicitly approves production-bound changes. Validation must be complete.
  - section: workflow-signals
    signal: "**Production promotion** (any deployment to prod, customer environments, live traffic)"
    route_to: dispatcher (explicit human approval required)
    notes: "**Always** require explicit human sign-off before production-bound work merges or ships. No automation here."
  - section: workflow-signals
    signal: "**Session start / work planning** (new task, unclear next steps)"
    route_to: dispatcher
    notes: Retrieve bounded context with `/crew:brief-me`. Define scope, assign to role, set pace. Avoid ambiguity at start.
  - section: workflow-signals
    signal: "**Blocked work or escalation** (dependency unmet, config broken, ambiguous requirements)"
    route_to: dispatcher
    notes: Unblock by re-scoping, deferring, or escalating to stakeholder. Document the blocker in repo memory.
  - section: workflow-signals
    signal: "**New feature scope unclear or ambitious** (large FEAT, cross-cutting concern, product direction question)"
    route_to: dispatcher via **gstack `/office-hours`** + **`/plan-ceo-review`**
    notes: Dispatcher uses `/office-hours` (6 forcing questions) then `/plan-ceo-review` (CEO scope challenge) before writing the slice or dispatching fullstack-dev. Reduces scope drift before implementation starts.
  - section: workflow-signals
    signal: "**Pre-compaction or multi-agent handoff context prep** (≥3 compactions observed, agent handoff with heavy context, session checkpoint at milestone)"
    route_to: dispatcher
    notes: Load `skills/workflow/context-curation/`. Use Quick / Full / Archived formats per the skill's size budgets. Pair with `/loop:snapshot-memory` for durable cross-session memory.
  - section: workflow-signals
    signal: "**SPEC authoring or large-scope FEAT decomposition** (multi-FEAT spec, multi-week project, multi-stack capability)"
    route_to: dispatcher / architect
    notes: Load `skills/workflow/spec-decomposition/` for structured WBS + dependency graph + parallelism map + risk register. Pair with `/loop:spec-decompose` for FEAT-NNN derivation.
  - section: workflow-signals
    signal: "**Slice sizing / dispatch-budget estimation** (estimating turns before dispatch, deciding whether to split)"
    route_to: dispatcher
    notes: Load `skills/workflow/slice-sizing/` for 8/80-hour atomic action rule + fullstack-dev cap-budget evidence. Pairs with `skills/workflow/spec-decomposition/`.
  - section: workflow-signals
    signal: "**Parallel autonomous-safe feature execution** (run multiple triaged FEATs simultaneously in isolated worktrees)"
    route_to: "`/crew:parallel` skill (Path A, FEAT-136)"
    notes: Use `/crew:parallel [--max-features N]`. Creates one git worktree per FEAT, resolves the loop CLI path, calls `loop dispatch prepare` to spawn worktrees, then dispatches `crew:build` per worktree **in one parallel Agent block** (no `parallel-runner` agent involved—Path A avoids hook conflicts). Each `crew:build` runs the per-worktree slice ceremony inline. After all agents return, calls `loop dispatch finalize` to merge DONE children to main in priority order. Conflicted branches left alive for manual resolution.
  - section: workflow-signals
    signal: "**Quick-win chore lane** (small doc / comment / artifact-hygiene wins to harvest alongside an active wave/slice, disjoint from its files)"
    route_to: "`/crew:quickwin` skill (#163)"
    notes: Spawns or reuses a date-keyed `chore/quickwins-<date>` worktree (`crew quickwin-lane spawn`) so wins commit + PR + merge independently of the active wave branch. Verify the file set is disjoint from the active wave lane first (`crew claim-check`) — overlapping files route onto the wave branch instead; claim only the disjoint set. Docs-only pushes skip the verifier gate (pre-push-verifier docs-only early-allow). Batch the day's wins into one PR.
  - section: workflow-signals
    signal: "**Light-tier mechanical build** (≤2 files, ≤50 LOC diff, no new abstractions, no public-surface change — typos, mechanical renames, comment removal, format tweaks, single-function bug fix)"
    route_to: "`crew:dev-lite`"
    notes: Surgical editor; escalates back to fullstack-dev if scope grows past the cap. Pairs with the light-tier review row below.
  - section: workflow-signals
    signal: "**Light-tier fast review** (reviewing a `dev-lite`-scoped diff — ≤2 files, ≤50 lines, semantically trivial)"
    route_to: "`crew:reviewer-lite`"
    notes: Single review pass with one stack skill auto-loaded from diff extensions. Returns `review_decision` only — validation stays owned by the pre-push hook + `/crew:ship`.
  - section: workflow-signals
    signal: "**Test suite build-out or flaky-suite fix** (missing coverage identified by `qa-expert`, explicit AC list needs a test harness, flaky suite needs stabilizing)"
    route_to: "`crew:test-automator`"
    notes: Consumes `qa-expert` gap reports or explicit AC lists; builds suites/fixtures/harnesses and CI wiring. Test code only — never edits product source to make a test pass.
  - section: review-gates
    signal: '**Reviewer feedback / code quality gate** (PR review needed, lint check, "review this PR", "review my diff")'
    route_to: "**`crew:reviewer` agent** (exact name)"
    notes: Reviewer gates all code-bearing changes before merge. Feedback written as inline PR comments when possible. **Do not dispatch `code-reviewer` or other generically-named review agents for crew review phase** — they have overlapping trigger phrases ("review this PR") but do not honor the Crew review-artifact contract or `agents/reviewer.md` policy. Use them only for ad-hoc spot-checks outside `/crew:review`.
  - section: review-gates
    signal: "**Review or validate dispatch for a slice** (`/crew:review` or `/crew:validate` invoked for a slice)"
    route_to: "`commands/review.md`, `commands/validate.md` → `scripts/lib/build-bundle/inline.ts`"
    notes: "Before the reviewer / verifier subagent is dispatched, the command resolves the current slice id from `.claude/state/crew/workflow-state.json` and calls `inlineLatestBundle({ sliceId })` to preload the fullstack-dev's working set (handoff body, `git diff`, touched + Read file contents) under a `## Fullstack-dev context (preloaded — do not re-Read these files)` header inlined before the role-specific task body. Empty return when no bundle exists — non-blocking, dispatch proceeds with today's handoff-only prompt. Schema: `docs/standards/build-bundle-schema.md`."
  - section: review-gates
    signal: "**Plugin shape change** (diff touches `.claude-plugin/marketplace.json`, `plugin.json`, `agents/`, `commands/`, `hooks/`, or `.mcp.json`)"
    route_to: reviewer via **`plugin-dev:plugin-validator`**
    notes: Reviewer invokes `plugin-dev:plugin-validator` for manifest + structure review _alongside_ the local CI gate `node ./scripts/validate-manifests.ts` (the latter is hard-fail). Cite both in the review-result artifact.
  - section: review-gates
    signal: "**Skill shape change** (diff touches any `skills/**/SKILL.md`)"
    route_to: reviewer via **`plugin-dev:skill-reviewer`**
    notes: Reviewer invokes `plugin-dev:skill-reviewer` for triggering-effectiveness + best-practice feedback, plus `node ./scripts/validate-skills.ts` for the structural quality bar (tier, ≤200 lines, required headings). Both required when skills change.
  - section: review-gates
    signal: "**TDD / test-adequacy enforcement on review**"
    route_to: "`agents/reviewer.md` TDD gate + `scripts/crew.ts` hard-gate in `write-review-result`"
    notes: reviewer must populate `--test-summary` for approved code-bearing diffs; CLI exits non-zero otherwise.
  - section: review-gates
    signal: "**Code-bearing slice completed (build → review → validate)**"
    route_to: dispatcher → always `crew:verifier`
    notes: Builders run only affected-class tests + typecheck (scoped fast inner loop); the verifier owns the mandatory full gate — whole-repo `npm run lint`, the format check, the complete test suite, and the full verifier suite (`scripts/validate-all.ts`). **No skip path, even for code-only diffs** (supersedes the former FEAT-030 reviewer-bundled-validation skip). Only an explicit environment-blocked `validation_skipped` is permitted.
  - section: review-gates
    signal: "**Slice opens (subagent dispatch ahead)**"
    route_to: dispatcher
    notes: apply model-selection gate per `docs/standards/model-selection.md` — recommend Sonnet for spec-framed mechanical slices, Opus only for ambiguous architecture / hard refactor / design choice; surface recommendation in run-brief; track via `cost-report.modelMix` (FEAT-031)
  - section: review-gates
    signal: "**Security-sensitive change** (auth, crypto, input handling, secrets, RBAC, token management)"
    route_to: reviewer via **gstack `/cso`**
    notes: "Reviewer invokes `/cso` (OWASP + STRIDE audit) alongside normal review for security-bearing diffs. Complements crew review artifacts with security-specific findings. Co-cite: `skills/domain/security-advisory/` for subject-area discipline guide."
  - section: review-gates
    signal: "**Dependency / lockfile change** (diff touches `package.json`, `bun.lock`, `requirements.txt`, `pyproject.toml`, `Cargo.toml`, `go.mod`, `*.csproj`)"
    route_to: reviewer via **`skills/domain/security-sweep/`**
    notes: Reviewer loads security-sweep alongside the existing per-language reviewer. Pre-flight CVE audit (reviewer.md lines 103-104) is replaced by the structured procedure in the skill — same commands, but findings emitted as severity-tagged path+line blocks and counted in the review-result `--findings` count.
  - section: review-gates
    signal: "**Auth-touching diff** (diff touches files matching `(auth|login|signin|signup|jwt|oauth|session|token|password|crypto|secret|credential)`, or path under `*/auth/*`, `*/security/*`)"
    route_to: "reviewer via **`skills/domain/security-sweep/`** + **`skills/domain/security-advisory/`**"
    notes: Co-load with security-advisory for OWASP / threat-model context. Secrets-scan pattern set in security-sweep runs severity-tagged path+line emission on the diff; security-advisory handles OWASP-shape questions. Replaces the implicit "remember to invoke /cso" path with an auto-trigger.
  - section: review-gates
    signal: "**Diff under review (any code-bearing change)** (reviewing a PR, diff, or completed implementation)"
    route_to: reviewer
    notes: Load `skills/workflow/reviewing-code/` for review procedure — correctness, regressions, scope drift, test-gap checks. Pairs with `plugin-dev:plugin-validator` and `plugin-dev:skill-reviewer` when the diff touches plugin shape or skills.
  - section: review-gates
    signal: "**Test suite quality questioned** (coverage looks adequate but `test_confidence` grade < 0.80 across recent slices, or reviewer suspects flaky / anti-pattern / weak-assertion tests)"
    route_to: "`qa-expert` via **`skills/workflow/test-quality/`**"
    notes: Loads the test-quality lens — flaky-test regex set (timer/sleep/wall-clock/non-seed-random/shared-state), anti-pattern scan (assertion-free, tautological assert, over-mocking), and mutation-testing advisory for critical-path modules. Findings emitted as `[SEVERITY] file:line` blocks parallel to security-sweep. Advisory tier — does NOT auto-block merge; qa-expert applies judgment via the `quality_concerns` verdict.
  - section: review-gates
    signal: "**Architecture design review before build** (an ADR, design proposal, or system topology needs independent evaluation before builders start)"
    route_to: "`crew:architect-reviewer`"
    notes: Assesses service boundaries, scalability, technical debt, integration patterns, and modernization risks. Distinct from `crew:reviewer` (code-change review) and `crew:architect` (design authoring).
  - section: review-gates
    signal: "**C# / .NET stack-quality fan-out review** (`stack:csharp` slice needs deep .NET idiom review)"
    route_to: "`crew:csharp-reviewer` (alongside `crew:reviewer`)"
    notes: Read-only fan-out — async correctness, EF Core patterns, ASP.NET Core wiring, null safety, production readiness. Returns `[SEVERITY] file:line` findings.
  - section: review-gates
    signal: "**TypeScript / Node stack-quality fan-out review** (`stack:typescript` slice needs deep TS idiom review)"
    route_to: "`crew:typescript-reviewer` (alongside `crew:reviewer`)"
    notes: Read-only fan-out — compiler compliance, type safety, Zod boundaries, async correctness, React rules, banned libraries, supply chain. Returns `[SEVERITY] file:line` findings.
  - section: code-language
    signal: "**Building / editing Microsoft SDK code** (Azure SDKs, .NET libs, M365 APIs, anything namespaced `Microsoft.*` / `Azure.*`)"
    route_to: fullstack-dev via **`microsoft-docs:microsoft-code-reference`**
    notes: Verify method signatures + parameter shapes against official MS docs before committing. Catches hallucinated APIs that pass type-check but fail at runtime. Reviewer cross-checks on the way in.
  - section: code-language
    signal: "**Backend code change, untagged slice** (server-side logic, API handlers, data layer, service orchestration; no surface:*/stack:* tags — tagged slices follow the Builder routing matrix above)"
    route_to: fullstack-dev
    notes: Load `skills/domain/architecture/backend-advisory/` for backend patterns and quality bar. Tagged backend slices route to `crew:backend-dev` per the Builder routing matrix — this generalist row is the untagged fallback only.
  - section: code-language
    signal: "**Frontend code change, untagged slice** (UI components, client-side logic, CSS, browser-rendered output; no surface:*/stack:* tags — tagged slices follow the Builder routing matrix above)"
    route_to: fullstack-dev
    notes: Load `skills/domain/ui/react-engineering/` for frontend patterns and quality bar. Tagged UI slices route to `crew:frontend-dev` per the Builder routing matrix — this generalist row is the untagged fallback only.
  - section: code-language
    signal: "**Full-stack change spanning both frontend and backend, untagged slice** (shared data shape, API + UI wired end-to-end; tagged cross-layer slices follow the Builder routing matrix above)"
    route_to: fullstack-dev
    notes: Load `skills/domain/architecture/fullstack-advisory/` for cross-layer coherence checks. Pairs with backend and frontend advisory rows when the diff touches both surfaces separately.
  - section: code-language
    signal: "`tags include surface:ui or stack:react AND (tags include surface:api/schema OR stack:csharp/node/python)`"
    route_to: dispatch `crew:frontend-dev` for FE diff + `crew:backend-dev` for BE diff in parallel (orchestrate-slice Step 2+3); integrator gates afterward
    notes: <!-- routing-lint:ignore -->
  - section: code-language
    signal: "`tags include surface:ui or stack:react AND NOT (any backend stack tag)`"
    route_to: dispatch `crew:frontend-dev` only
    notes: <!-- routing-lint:ignore -->
  - section: code-language
    signal: "`tags include (surface:api or surface:schema or any backend stack:*) AND NOT (surface:ui or stack:react)`"
    route_to: dispatch `crew:backend-dev` only
    notes: <!-- routing-lint:ignore -->
  - section: code-language
    signal: "**Python code change** (`*.py` file edit, FastAPI/Django/Flask service, data pipeline)"
    route_to: fullstack-dev
    notes: Load `skills/domain/python-pro/` for type-safe, async, Pythonic patterns and quality bar.
  - section: code-language
    signal: "**TypeScript / TSX code change** (`*.ts` / `*.tsx` file edit, any framework or runtime)"
    route_to: fullstack-dev
    notes: Load `skills/domain/typescript-pro/` for advanced type system patterns, full-stack type safety, and build tooling guidance.
  - section: code-language
    signal: "**AI app / LLM SDK code** (Anthropic / OpenAI SDK imports, prompt engineering infra, agent frameworks, model training or inference code)"
    route_to: fullstack-dev
    notes: Load `skills/domain/ai-engineering/` for end-to-end AI system guidance. Co-cite `skills/domain/prompt-engineering/` for prompt-authoring concerns.
  - section: code-language
    signal: "**React-specific code** (hooks, state management, Server Components, Suspense, concurrent rendering, performance, React Testing Library, Next.js App Router)"
    route_to: fullstack-dev
    notes: Load `skills/domain/ui/react-engineering/`. Co-cite `skills/domain/ui/react-engineering/` for general frontend concerns. Co-cite `skills/domain/typescript-pro/` for `*.tsx` type patterns.
  - section: code-language
    signal: "**Tailwind CSS change** (utility-class styling, responsive variants, `tailwind.config.*`, dark-mode tokens, plugin authoring)"
    route_to: fullstack-dev
    notes: Load `skills/domain/ui/tailwind-patterns/` for utility-first patterns, responsive design, and anti-patterns. Co-cite `skills/domain/frontend-design/` for visual layout context.
  - section: code-language
    signal: "**Frontend visual / creative design** (CSS layout, color systems, typography, visual hierarchy, design-to-code)"
    route_to: fullstack-dev / uxdesigner
    notes: Load `skills/domain/frontend-design/` for visual design patterns and CSS best practices — `references/structural-dna.md` for page structure, `references/style-selection.md` for direction/palette/fonts per product type. Co-cite `skills/domain/ui/tailwind-patterns/` when stack uses Tailwind.
  - section: code-language
    signal: '**UI design quality complaint** ("looks generic", "AI slop", low visual polish, template feel)'
    route_to: uxdesigner
    notes: "Load `skills/domain/frontend-design/` end-to-end: run the reference-research + structural-DNA process, produce a UX spec with explicit `## Visual direction`, and gate the rebuild against `references/react-ui-quality.md`."
  - section: code-language
    signal: "**Mobile app code change** (React Native, Flutter, iOS Swift, Android Kotlin, mobile-specific APIs)"
    route_to: fullstack-dev via `agents/3rdparty/mobile-developer.md`
    notes: Delegate implementation to `mobile-developer`. Co-cite `skills/domain/mobile/mobile-design/` for mobile UX constraints.
  - section: code-language
    signal: "**MCP server authoring or debugging** (Model Context Protocol server, tool definitions, resource handlers, Claude extension)"
    route_to: fullstack-dev
    notes: Load `skills/domain/mcp-integration/` for config format, security, and integration patterns.
  - section: architecture
    signal: "**Architecture sketch / system design** (ADR drafting, system design, capacity or topology decisions)"
    route_to: "`agents/architect.md`"
    notes: Load `skills/domain/architecture/architecture-advisory/`. Architect handles backend service architecture inline (see `## Backend architecture` section). Delegates to `agents/cloud-architect.md` via Agent tool for cloud concerns; DB concerns handled inline by architect. For API contract work load `skills/domain/architecture/api-architecture/` inline; for diagrams load `skills/domain/architecture/diagram-methodology/` inline.
  - section: architecture
    signal: "**Schema design / migration planning / database performance tuning** (ER modeling, schema evolution, index strategy, technology selection, multi-tenancy, sharding, CQRS, event sourcing)"
    route_to: architect / fullstack-dev
    notes: Load `skills/domain/backend/database-architecture/`. PostgreSQL-specific query tuning (EXPLAIN analysis, index strategy, replication) is handled inline with that skill loaded.
  - section: architecture
    signal: "**Cloud infra design** (multi-region, landing zone, IAM, network topology, multi-cloud, disaster recovery, cost optimization, FinOps)"
    route_to: architect / release-engineer
    notes: Load `skills/domain/infra/cloud-architecture/`. For IaC specifics, co-cite `skills/domain/infra/devops-engineering/references/iac.md`.
  - section: infra-ops
    signal: "**CI/CD pipeline change** (`.github/workflows/*.yml`, `azure-pipelines.yml`, `Jenkinsfile`, `*.gitlab-ci.yml`, build-system config)"
    route_to: release-engineer
    notes: Load `skills/domain/infra/devops-engineering/` + `references/ci-cd.md` for pipeline-specific patterns (stages, artifact management, deployment strategies, anti-patterns).
  - section: infra-ops
    signal: "**IaC change** (Terraform, Bicep, Helm, Ansible)"
    route_to: release-engineer + fullstack-dev
    notes: "Co-cite alongside the Terraform HCL row: load `skills/domain/infra/devops-engineering/references/iac.md` for module patterns, state management, and multi-env variable isolation. For provisioner timing, multi-env drift, and TLS/ACME failures, also load `skills/domain/infra/terraform-ops-traps/`."
  - section: infra-ops
    signal: "**Terraform operational issue** (state drift, multi-env config drift, container `Restarting` after `apply`, TLS/ACME failure, fresh-instance bootstrap)"
    route_to: researcher + fullstack-dev via **`crew:terraform-ops-traps`** ops-traps body + `references/{provisioner-traps,multi-env-isolation,zero-to-deploy}.md`
    notes: Operator-incident patterns with copy-paste fixes. Load `references/*.md` on demand for full HCL examples — the main skill body stays ≤200 lines.
  - section: infra-ops
    signal: "**Incident response / production troubleshooting** (deployment failure, CrashLoopBackOff, service 503, postmortem)"
    route_to: release-engineer + verifier
    notes: Load `skills/domain/infra/devops-engineering/references/troubleshooting.md` for structured gather-facts → diagnose → fix → verify → postmortem procedure. Pairs with `skills/workflow/root-cause-discipline/` for root-cause tracing.
  - section: infra-ops
    signal: "**Rollback-readiness assessment / rollback-vs-forward-fix call under active incident**"
    route_to: release-engineer
    notes: Load `skills/domain/infra/deployment-patterns/` → `## Rollback decision matrix`. Match severity × data impact × time-to-fix; cite the matched matrix cell + applicable tie-breaker in `--evidence`. Default to rollback when blast radius is growing or diagnosis confidence < 70%.
  - section: infra-ops
    signal: "**Silent-failure risk on runnable change** (server / worker / hook / CLI entry / scheduled job)"
    route_to: reviewer
    notes: Load `skills/workflow/review-gates/` → `### Silent-failure hunt`. Scan for swallowed errors, catch-then-continue without telemetry, dropped promise rejections, inadequate fallbacks, missing health-check tiers (liveness / readiness / startup), and `process.exit()` from library functions.
  - section: infra-ops
    signal: "**Performance-sensitive change shipped** (latency-critical path, throughput regression risk, bundle size impact)"
    route_to: release-engineer / verifier via **gstack `/benchmark`**
    notes: Gather perf evidence alongside deployment evidence. Run before and after to produce delta metrics.
  - section: infra-ops
    signal: "**Web UI behavior changed** (frontend components, user-visible flows, browser-rendered output)"
    route_to: "verifier (local browser harness only — **gstack `/qa` DISABLED**: Playwright path was unstable + could exit current repo context)"
    notes: "Verifier runs `bun test --parallel <ui-test.test.ts>` locally and records `gstack: unavailable — fell back to local harness` in `--evidence`. Do NOT invoke `/qa`. Re-enable only after the cross-repo stability issue is resolved."
  - section: infra-ops
