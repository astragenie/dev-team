prompt_id: reviewer
versions_under_test:
  - file://agents/reviewer.md

# SLICE-111 (FEAT-186 S2): daily budget enforcement for live judge runs.
# Remove or set to a large value to disable effective capping.
# persist_path defaults to .claude/state/gepa-meter-<prompt_id>.json.
# provider_ceilings override the per-provider reservation estimate (USD);
# omit to use the DEFAULT_PROVIDER_CEILINGS from evals/lib/meter.ts.
budget:
  daily_cap_usd: 5.00
  # persist_path: .claude/state/gepa-meter-reviewer.json  # optional override
  # provider_ceilings:
  #   groq: 0.03

candidate:
  runner: claude-p
  model: claude-sonnet-4-6
  subscription: true

judge:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.0
  fallback:
    - provider: gemini
      model: gemini-2.5-flash

# Validation tier — fires on judge disagreement OR --validate flag. Off by default.
# claude-p removed from judge role to avoid Anthropic-family bias when judging
# a Claude candidate. ollama-local removed 2026-06-29: llama3.1:8b too small for
# behavioral meta-rubrics (quote-to-refuse vs adopt). Triangulation now: groq
# (primary) + gemini (fallback / cross-org disagreement detection).
validate_with:
  - provider: gemini
    model: gemini-2.5-flash

tests:
  - name: blocker-on-null-deref
    fixture: file://evals/fixtures/reviewer-null-deref.diff
    assert:
      # Reviewer severity tokens are CRITICAL/HIGH/MEDIUM/LOW (agents/reviewer.md:137).
      # `[BLOCKER]` was the legacy token; assertion updated 2026-06-29.
      - type: not-contains
        value: "[LOW]"
      - type: llm-rubric
        rubric: >
          PASS when the response BOTH (a) identifies a null dereference risk
          (accessing .items on a variable that may be null because the null
          guard was removed), AND (b) tags it at a blocking severity. Blocking
          severities are `[CRITICAL]` AND `[HIGH]` — EITHER is acceptable.
          Reviewer severity map (per agents/reviewer.md:137): CRITICAL is for
          security / data loss; HIGH is for correctness / regression. Null
          deref legitimately fits HIGH (regression-class), so `[HIGH]` is a
          PASS, not a FAIL. Only fail when the finding is tagged `[MEDIUM]`,
          `[LOW]`, or no severity tag at all.

  - name: no-blocker-on-clean-rename
    fixture: file://evals/fixtures/reviewer-clean-rename.diff
    assert:
      - type: not-contains
        value: "[CRITICAL]"
      - type: not-contains
        value: "[HIGH]"

  - name: verdict-shape
    fixture: file://evals/fixtures/18-file-fanout.json
    assert:
      - type: artifact-exists
        path: evals/runs
