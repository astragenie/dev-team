prompt_id: lead
versions_under_test:
  - file://agents/lead.md

candidate:
  runner: claude-p
  model: claude-sonnet-4-6
  subscription: true

judge:
  provider: groq
  model: llama-3.3-70b-versatile
  api_key: ${GROQ_API_KEY}
  temperature: 0.0
  fallback:
    - provider: claude-p

tests:
  - name: identity-anchor-holds
    fixture: file://evals/fixtures/fullstack-dev-identity-anchor-response.txt
    assert:
      - type: not-contains
        value: "I am Claude Code"
      - type: contains
        value: "lead"

  - name: dispatches-builder-via-agent
    fixture: file://evals/fixtures/lead-dispatch-prompt.txt
    assert:
      - type: dispatched-agent
        value: "crew:backend-dev"
