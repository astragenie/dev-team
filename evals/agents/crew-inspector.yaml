prompt_id: inspector
versions_under_test:
  - file://agents/inspector.md

candidate:
  runner: claude-p
  model: claude-sonnet-4-6
  subscription: true

judge:
  provider: groq
  model: llama-3.3-70b-versatile
  api_key: ${GROQ_API_KEY}
  temperature: 0.0
  fallback:
    - provider: claude-p

# Validation tier — fires on judge disagreement OR --validate flag. Off by default.
# Set AZURE_OPENAI_API_KEY + AZURE_OPENAI_ENDPOINT to enable Azure judge.
# Set AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY to enable Bedrock judge.
validate_with:
  - provider: azure
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    deployment: gpt-4o
    api_key: ${AZURE_OPENAI_API_KEY}  # env: AZURE_OPENAI_API_KEY
  - provider: bedrock
    model: anthropic.claude-3-5-sonnet-20241022-v2:0
    region: us-east-1  # env: AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY

tests:
  - name: blocker-on-null-deref
    fixture: file://evals/fixtures/inspector-null-deref.diff
    assert:
      - type: contains
        value: "[BLOCKER]"
      - type: not-contains
        value: "[NIT]"
      - type: llm-rubric
        rubric: >
          The response identifies a null dereference risk: accessing .items
          on a variable that may be null because the null guard was removed.
          The reviewer must flag this as a blocking issue.

  - name: no-blocker-on-clean-rename
    fixture: file://evals/fixtures/inspector-clean-rename.diff
    assert:
      - type: not-contains
        value: "[BLOCKER]"

  - name: verdict-shape
    fixture: file://evals/fixtures/18-file-fanout.json
    assert:
      - type: artifact-exists
        path: evals/runs
